<!DOCTYPE html>
<html>
    <head>
        <title>Log in</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS/bootstrap.min.css">
        <link rel="stylesheet" href="CSS/main.css">
        <link rel="stylesheet" href="CSS/buttons.css">
        <link rel="stylesheet" href="CSS/texts.css">
    </head>
    
    
    <body>
        
        
        <div class="container-fluid
             row row-cols-1 row-cols-md-1 row-cols-lg-2
             align-items-stretch"
             style="height:100vh;">
            
                
            <!-- Form -->
            <div class="col d-flex">

                
                <div class="container-sm
                     d-flex flex-column
                     justify-content-center
                     align-items-center">
                    
                    <div>

                        <div class="h-3-black text-center">Вход в аккаунт</div>


                        <form method="post" action="PHP/Authorization.php"
                              class="d-flex flex-column
                              justify-content-center
                              align-items-center">

                              <input class="p-2 m-2 input-accent-outline"
                                     name="Email" placeholder="E-mail" type="email">

                              <input class="p-2 m-2 input-accent-outline"
                                     name="Password" placeholder="Пароль" type="password">

                              <button class="p-2 m-2
                                      flex-grow-1 w-100
                                      btn btn-accent btn-lg"
                                      type="Submit">
                              Войти!
                              </button> 

                        </form>
                        
                    </div>
                    
                </div>
                
            </div>

            
            <!-- Icon -->
            <div class="col bg-accent-unity
                 d-none d-md-flex">

                <div class="container-sm
                     d-flex
                     justify-content-center
                     align-items-center">

                    <img src="Images/Frog.gif" alt="Frog">

                </div>

 
            </div>

            
        </div>
        
    </body>
</html>
